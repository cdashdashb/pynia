[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pynia"
version = "0.1.0"
description = "Python interface and visualizers for the OCZ Neural Impulse Actuator (NIA)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pyusb>=1.2,<2",
    "pyglet>=2.0",
]

[project.optional-dependencies]
# Higher-quality DSP path: NiaData(high_quality_dsp=True)
dsp = ["scipy>=1.11"]
# Web front-end (http.py). web.py is largely unmaintained -- consider migrating
# http.py to Flask/FastAPI in a future pass.
web = ["web.py>=0.62"]

[tool.setuptools]
py-modules = ["nia", "pynia", "http"]
